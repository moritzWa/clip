[package]
name = "clip"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Native macOS clipboard history with local search and screenshot OCR"
repository = "https://github.com/moritzWa/clip"

[dependencies]
block2 = "0.6.2"
global-hotkey = "0.10.0"
objc2 = "0.6.5"
objc2-app-kit = "0.3.2"
objc2-av-foundation = { version = "0.3.2", default-features = false, features = ["std", "AVPlayer", "AVPlayerItem", "AVPlayerLayer", "objc2-core-media", "objc2-quartz-core"] }
objc2-core-media = { version = "0.3.2", default-features = false, features = ["std", "CMTime"] }
objc2-core-foundation = "0.3.2"
objc2-core-graphics = "0.3.2"
objc2-foundation = "0.3.2"
objc2-image-io = "0.3.2"
objc2-quartz-core = "0.3.2"
objc2-quick-look-ui = "0.3.2"
objc2-vision = "0.3.2"
rusqlite = { version = "0.43.0", features = ["backup", "bundled"] }
sha2 = "0.11.1"
